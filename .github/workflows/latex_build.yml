name: Build Research Paper

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: ./paper
          continue_on_error: "true"

      - name: Check for PDF output
        run: |
          ls -la paper/ || true
          ls -la main.pdf || true
          ls -la paper/main.pdf || true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('paper/main.pdf') != ''
        with:
          name: USMLE_Research_Draft
          path: paper/main.pdf
          retention-days: 30

      - name: Upload PDF artifact (fallback)
        uses: actions/upload-artifact@v4
        if: hashFiles('main.pdf') != ''
        with:
          name: USMLE_Research_Draft
          path: main.pdf
          retention-days: 30
