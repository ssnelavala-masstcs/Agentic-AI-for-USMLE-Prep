name: Build Research Paper

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: ./paper
          continue_on_error: "true"
          args: "-pdf -file-line-error -interaction=nonstopmode"
          post_compile: |
            # Run latexmk again to resolve cross-references
            latexmk -pdf -interaction=nonstopmode main.tex || true

      - name: Check for PDF output
        run: |
          echo "Checking for PDF..."
          find . -name "main.pdf" -exec ls -la {} \;

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: USMLE_Research_Draft
          path: paper/main.pdf
          retention-days: 30
          if-no-files-found: error
