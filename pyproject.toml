[project]
name = "agentic-usMLE-prep"
version = "1.0.0"
description = "Agentic AI for Personalized USMLE Study Planning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Stanley Sujith Nelavala"}
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.1",
    "groq>=0.11.0",
    "supabase>=2.9.1",
    "langgraph>=0.2.44",
    "langchain-core>=0.3.12",
    "langchain-groq>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.black]
line-length = 100
