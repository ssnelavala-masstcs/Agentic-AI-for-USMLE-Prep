## Profile 1: The "Biochemistry Struggler"

```yaml
persona_id: "IMG-BIO-001"
name: "Priya Sharma"
background:
  origin: "India"
  medical_school: "Government Medical College, Chennai"
  graduation_year: 2023
  us_clinical_experience: "2 months observership in Internal Medicine"
  
baseline_metrics:
  nbme_score: 180
  uworld_percentile: 42
  uworld_correct_rate: 48
  
weak_areas:
  - area: "Biochemistry"
    proficiency: 35
    specific_gaps:
      - "Enzyme kinetics (Michaelis-Menten, inhibition patterns)"
      - "Glycogen storage diseases"
      - "Lipid metabolism pathways"
      - "Vitamin deficiencies"
  - area: "Molecular Biology"
    proficiency: 40
    specific_gaps:
      - "DNA repair mechanisms"
      - "Transcription regulation"
      - "Genetic inheritance patterns"
      
strong_areas:
  - area: "Anatomy"
    proficiency: 75
  - area: "Physiology"
    proficiency: 72
  
constraints:
  study_hours_per_day: 6
  days_available: 7
  target_exam_date: "2026-09-15"
  months_to_exam: 5
  budget: "Limited - relies on UWorld + First Aid only"
  
learning_style:
  preference: "Visual learner"
  struggles_with: "Long reading sessions"
  responds_well_to: "Videos + practice questions + pathology images"
  preferred_modalities: ["video", "image", "text"]

gold_standard_plan:
  # Blessie's ideal plan for this student
  week_1_focus:
    primary: "Biochemistry - Metabolic Pathways (First Aid + Pathoma videos)"
    secondary: "Physiology review (maintenance - Anki only)"
    practice_questions: 150
    expected_improvement: "Biochem 35% → 42%"
  week_2_focus:
    primary: "Biochemistry - Molecular Biology + Genetics"
    secondary: "Anatomy rapid review"
    practice_questions: 175
    expected_improvement: "Biochem 42% → 48%"
  critical_resources:
    - "Boards & Beyond Biochemistry lectures"
    - "UWorld Biochemistry questions (all)"
    - "First Aid Biochemistry chapter (annotated)"
    - "Anki - AnKing Biochemistry cards"
```

