## Validation Rubric (For Blessie)

When reviewing AI-generated plans for these personas, score each on:

| Criterion | 0 (Fail) | 1 (Partial) | 2 (Pass) |
|-----------|----------|-------------|----------|
| **Addresses stated weak areas** | Ignores weak areas | Some focus | Primary focus on weakest |
| **Respects time constraints** | Plans exceed available hours | Close to limit | Well-calibrated |
| **Resource appropriateness** | Recommends wrong-level resources | Mostly appropriate | Perfectly matched |
| **Interleaving quality** | All blocked practice | Some mixing | Optimal interleaving |
| **Confidence building** | No consideration | Some encouragement | Strategic early wins |
| **IMG-specific needs** | Generic plan | Some IMG awareness | Addresses IMG gaps |
| **Feasibility** | Impossible schedule | Challenging but doable | Realistic and sustainable |

**Minimum acceptable score**: 10/14 (71%) for each persona's plan
